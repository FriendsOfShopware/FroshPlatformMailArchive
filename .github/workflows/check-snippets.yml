name: CheckSnippets
on:
  push:
    branches:
      - main
    paths:
      - 'src/**/snippet/*.json'
  pull_request:
    paths:
      - 'src/**/snippet/*.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compare snippet keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Compare snippet keys
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(./src/**/snippet/*.json)
          if (( ${#files[@]} < 2 )); then
            echo "Expected at least two snippet files, found ${#files[@]}" >&2
            exit 1
          fi
          npx --yes compare-json@0.4.0 -e -s="/" "${files[@]}"
